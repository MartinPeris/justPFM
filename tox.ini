[tox]
min_version = 4.11
env_list = lint, py, package

[testenv]
base_python = {env:JUSTPFM_TEST_PYTHON:python}
description = Test the installed wheel and enforce statement and branch coverage
package = wheel
deps =
    pytest==7.4.4; python_version < "3.10"
    pytest==9.1.1; python_version >= "3.10"
    pytest-cov==4.1.0; python_version < "3.10"
    pytest-cov==7.1.0; python_version >= "3.10"
    hypothesis==6.79.4; python_version < "3.10"
    hypothesis==6.168.0; python_version >= "3.10"
    coverage[toml]==7.2.7; python_version < "3.10"
    coverage[toml]==7.16.1; python_version >= "3.10"
commands =
    python -m pytest --cov=justpfm --cov-report=term-missing --cov-report=xml {posargs}

[testenv:lint]
description = Enforce lint and formatting without modifying files
skip_install = true
deps = ruff==0.9.10
commands =
    ruff check .
    ruff format --check .

[testenv:package]
description = Build an sdist and a wheel from that sdist and validate metadata
skip_install = true
deps =
    build==1.6.1
    twine==7.0.0
commands =
    python -m build --outdir {env_tmp_dir}/dist
    python -m twine check --strict {env_tmp_dir}/dist/*
