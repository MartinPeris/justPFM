name: Release

on:
  release:
    types: [published]
  # Exercise the release checks and build without publishing.
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Release quality
    uses: ./.github/workflows/quality.yml

  distribution:
    name: Build and validate release
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build==1.2.2.post1 twine==6.1.0
      - name: Build release distributions
        run: python -m build
      - name: Validate release metadata
        run: python -m twine check --strict dist/*
      - name: Store validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
      - name: Publish only for a published release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
