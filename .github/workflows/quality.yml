name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  harness:
    name: Full harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tox.ini
            pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - name: Run the commit hook against all files
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Upload branch coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  compatibility:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        id: target
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Select compatible seed packages for Python 3.7
        if: matrix.python == '3.7'
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          VIRTUALENV_DOWNLOAD=true
          VIRTUALENV_PIP=24.0
          VIRTUALENV_SETUPTOOLS=68.0.0
          VIRTUALENV_WHEEL=0.42.0
          EOF
      - run: tox run -e py
        env:
          JUSTPFM_TEST_PYTHON: ${{ steps.target.outputs.python-path }}

  interoperability:
    name: Independent interoperability
    uses: ./.github/workflows/interoperability.yml

  quality:
    name: Quality gate
    if: always()
    needs: [harness, compatibility, interoperability]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to pass
        env:
          HARNESS_RESULT: ${{ needs.harness.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          INTEROPERABILITY_RESULT: ${{ needs.interoperability.result }}
        run: |
          test "$HARNESS_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$INTEROPERABILITY_RESULT" = success
