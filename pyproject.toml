[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py37"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["justpfm"]
relative_files = true

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2

[tool.coverage.xml]
output = "coverage.xml"
