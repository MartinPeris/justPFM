minimum_pre_commit_version: '3.5.0'
repos:
  - repo: local
    hooks:
      - id: quality
        name: Full quality harness (lint, tests, coverage, packaging)
        entry: tox run
        language: python
        language_version: python3.12
        additional_dependencies: [tox==4.61.5, virtualenv==21.7.11]
        pass_filenames: false
        always_run: true
        require_serial: true
